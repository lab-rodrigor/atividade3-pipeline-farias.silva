name: deploy

# O pipeline faz o que você fez à mão na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # TODO: troque pelo seu slug, o começo do seu e-mail com ponto virando hífen.
  SLUG: farias-silva
  # TODO: a primeira porta da sua faixa. Veja em `gr-docker ajuda`.
  PORTA: 23060

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          # TODO: apague os três containers, se existirem.
          # Dica: o passo não pode falhar quando eles ainda não existem.
           ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker rm banco || true"
           ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker rm api || true"
           ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker rm front || true"

      - name: Criar rede e volume
        run: |
          # TODO: as duas redes e o volume. A rede do banco é interna.
          # Dica: criar o que já existe devolve erro. Trate isso.
          ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker network create dados [--interna] || true"
          ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker network create web || true"
          ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker volume create pgdata || true"


      - name: Subir banco, API e front
        run: |
          # TODO: os três containers, na ordem certa.
          # O front precisa receber o commit que o deploy publicou:
          #   -e DEPLOY_SHA=${{ github.sha }}
          ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker run postgres:17-alpine --name banco -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} -e POSTGRES_DB=pokedex --network dados -v pgdata:/var/lib/postgresql/data"
          ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker run gr-atv2-api:1 --name api -e POSTGRES_HOST=gr-farias-silva-banco -e POSTGRES_DB=pokedex -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} --network web"
          ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker network connect dados api"
          ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker run gr-atv2-front:1 --name front -p 23060:80 -e API=gr-farias-silva-api -e DEPLOY_SHA=${{ github.sha }} --network web"


      - name: Conferir que subiu
        run: |
          ssh -i ~/.ssh/deploy gr-farias-silva@gr.lab.ayty.org "gr-docker ps"
